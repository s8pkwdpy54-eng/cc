<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }
        .container {
            max-width: 420px;
            padding: 25px;
            margin: auto;
        }
        .form {
            max-width: 300px;
            padding: 20px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            margin: 0 auto;
            background: white;
        }
        h1 {
            text-align: center;
            color: #E65C00;
            font-size: 22px;
            margin: 18px 0 20px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }
        button[type="submit"] {
            width: 100%;
            background-color: #E65C00;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button[type="submit"]:hover {
            background-color: #C44F00;
        }
        .logo {
            text-align: center;
            margin-bottom: 12px;
        }
        .logo svg {
            width: 260px;
            height: auto;
            display: inline-block;
        }
    </style>
</head>
