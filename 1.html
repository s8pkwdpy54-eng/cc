<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stagecoach Login</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-container{
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
    width:350px;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#ff6b00;
    margin-bottom:20px;
}

h2{
    text-align:center;
    color:#003a70;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#ff6b00;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#e65f00;
}

.signup{
    text-align:center;
    margin-top:15px;
}

.signup a{
    color:#003a70;
    text-decoration:none;
}
</style>
</head>
<body>

<div class="login-container">
    <div class="logo">Stagecoach</div>

    <h2>Sign In</h2>

    <form onsubmit="login(event)">
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Sign In</button>
    </form>

    <div class="signup">
        Don't have an account?
        #Register</a>
    </div>
</div>

<script>
function login(event){
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(email && password){
        alert("Login successful!");
        window.location.href = "dashboard.html";
    }
}
</script>

</body>
</html>
