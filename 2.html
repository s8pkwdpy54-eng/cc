<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{
      --sky:#0b3a5c;         /* deep western sky */
      --sun:#ffcc66;         /* warm stagecoach sun */
      --wood:#7a4b2a;        /* wagon wood */
      --ink:#1b1b1b;         /* dark text */
      --leather:#5a2f17;    /* leather */
      --rope:#d7b27a;       /* rope */
      --panel:#fff7e6;      /* parchment */
      --panel2:#f3e3c2;
      --accent:#d35400;     /* stagecoach orange */
      --accent2:#b84300;
      --danger:#b3261e;
    }

    body{
      font-family: Arial, Helvetica, sans-serif;
      margin:0;
      padding:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(1200px 600px at 50% 10%, rgba(255,204,102,.35), transparent 60%),
        radial-gradient(900px 500px at 10% 30%, rgba(255,204,102,.18), transparent 55%),
        linear-gradient(180deg, var(--sky), #081f33 55%, #061520);
      position:relative;
      overflow:hidden;
    }

    /* subtle “dust” */
    body:before{
      content:"";
      position:absolute;
      inset:-30%;
      background:
        repeating-radial-gradient(circle at 20% 20%, rgba(255,255,255,.06) 0 2px, transparent 3px 12px);
      opacity:.25;
      transform: rotate(-8deg);
      pointer-events:none;
    }

    .container{
      max-width:420px;
      padding:22px;
      margin:auto;
      position:relative;
      z-index:1;
    }

    /* Western frame */
    .form{
      max-width:330px;
      padding:20px;
      margin:0 auto;
      border-radius:14px;
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border: 2px solid rgba(122,75,42,.55);
      box-shadow:
        0 20px 50px rgba(0,0,0,.45),
        inset 0 0 0 2px rgba(215,178,122,.25);
      position:relative;
      overflow:hidden;
    }

    /* Rope trim top */
    .form:before{
      content:"";
      position:absolute;
      left:-20px;
      right:-20px;
      top:0;
      height:14px;
      background:
        linear-gradient(90deg,
          rgba(215,178,122,.0) 0%,
          rgba(215,178,122,.65) 8%,
          rgba(215,178,122,.0) 16%,
          rgba(215,178,122,.65) 24%,
          rgba(215,178,122,.0) 32%,
          rgba(215,178,122,.65) 40%,
          rgba(215,178,122,.0) 48%,
          rgba(215,178,122,.65) 56%,
          rgba(215,178,122,.0) 64%,
          rgba(215,178,122,.65) 72%,
          rgba(215,178,122,.0) 80%,
          rgba(215,178,122,.65) 88%,
          rgba(215,178,122,.0) 96%);
      opacity:.9;
      pointer-events:none;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
    }

    h1{
      text-align:center;
      color:#2a1a10;
      margin:6px 0 12px;
      font-size:22px;
      line-height:1.15;
      letter-spacing:.2px;
      text-shadow: 0 1px 0 rgba(255,255,255,.5);
    }

    /* Inputs */
    input[type="text"], input[type="password"]{
      width:100%;
      padding:12px 12px;
      margin:8px 0;
      box-sizing:border-box;
      border: 2px solid rgba(122,75,42,.35);
      border-radius:10px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
      color: var(--ink);
      outline:none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input[type="text"]::placeholder, input[type="password"]::placeholder{
      color: rgba(27,27,27,.55);
    }

    input[type="text"]:focus, input[type="password"]:focus{
      border-color: rgba(211,84,0,.8);
      box-shadow: 0 0 0 4px rgba(211,84,0,.18);
    }

    /* Button */
    button[type="submit"]{
      width:100%;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      color:white;
      padding:14px 20px;
      margin:10px 0 2px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
      letter-spacing:.2px;
      box-shadow:
        0 10px 25px rgba(211,84,0,.35),
        inset 0 0 0 1px rgba(255,255,255,.14);
      transition: transform .06s ease, filter .15s ease;
    }

    button[type="submit"]:hover{
      filter: brightness(1.05);
    }

    button[type="submit"]:active{
      transform: translateY(1px);
    }

    /* Keep your SVG style but make it feel “badge” like */
    svg{
      display:block;
      margin:0 auto 6px;
      width:150px;
      height:150px;
      border-radius:50%;
      background: rgba(255,255,255,.06);
      padding:6px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      border: 1px solid rgba(215,178,122,.35);
      backdrop-filter: blur(2px);
    }

    /* small screen */
    @media (max-width: 380px){
      .form{ padding:16px; }
      svg{ width:130px; height:130px; }
      h1{ font-size:20px; }
    }
  </style>
</head>
