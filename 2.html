<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Stagecoach Demo</title>

    <style>
        :root {
            --stagecoach-blue: #003b70;
            --stagecoach-orange: #f58220;
            --light-grey: #f4f5f7;
            --border-grey: #cccccc;
            --text-dark: #222222;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: var(--light-grey);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 25px;
        }

        .brand {
            background: var(--stagecoach-blue);
            color: white;
            text-align: center;
            padding: 22px;
            border-radius: 8px 8px 0 0;
        }

        .brand-name {
            font-size: 32px;
            font-weight: bold;
        }

        .orange-line {
            width: 60px;
            height: 5px;
            background: var(--stagecoach-orange);
            margin: 9px auto 0;
            border-radius: 3px;
        }

        .form {
            background: white;
            padding: 28px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: var(--stagecoach-blue);
            font-size: 25px;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin: 0 0 25px;
        }

        label {
            display: block;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: bold;
            margin: 14px 0 6px;
        }

        input {
            width: 100%;
            padding: 13px 12px;
            border: 1px solid var(--border-grey);
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: var(--stagecoach-orange);
        }

        button {
            width: 100%;
            background: var(--stagecoach-orange);
            color: white;
            padding: 14px 20px;
            margin-top: 22px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #d96f16;
        }

        .demo-note {
            margin-top: 18px;
            padding: 10px;
            background: #f0f4f8;
            border-radius: 4px;
            color: #666;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="brand">
            <div class="brand-name">Stagecoach</div>
            <div class="orange-line"></div>
        </div>

        <!--
            Demo endpoint only.

            This sends test_email and test_value to your
            own /test-submit endpoint.

            Do not put real passwords or other credentials
            into test_value.
        -->
        <form
            class="form"
            action="/test-submit"
            method="post"
        >

            <h1>Welcome</h1>

            <p class="subtitle">
                Stagecoach-style demonstration
            </p>

            <label for="email">
                Test email
            </label>

            <input
                id="email"
                name="test_email"
                type="email"
                placeholder="test@example.com"
                autocomplete="off"
                required
            >

            <label for="test-value">
                Test value
            </label>

            <input
                id="test-value"
                name="test_value"
                type="text"
                placeholder="Demo value"
                autocomplete="off"
                required
            >

            <button type="submit">
                Send Test
            </button>

            <div class="demo-note">
                Local testing only. No real credentials should be entered.
            </div>

        </form>

    </div>

</body>
</html>
