<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --stagecoach-blue: #003b70;
            --stagecoach-orange: #f58220;
            --light-grey: #f4f5f6;
            --border-grey: #d5d9dd;
            --text-dark: #222;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: var(--light-grey);
            color: var(--text-dark);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 25px;
        }

        /* Stagecoach-style header */
        .brand {
            background: var(--stagecoach-blue);
            padding: 22px;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }

        .brand-name {
            color: white;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .brand-line {
            width: 55px;
            height: 5px;
            background: var(--stagecoach-orange);
            margin: 8px auto 0;
            border-radius: 3px;
        }

        .form {
            background: white;
            padding: 28px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            color: var(--stagecoach-blue);
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin: 0 0 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 13px 12px;
            border: 1px solid var(--border-grey);
            border-radius: 5px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--stagecoach-orange);
            box-shadow: 0 0 0 2px rgba(245, 130, 32, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            background: var(--stagecoach-orange);
            color: white;
            padding: 14px 20px;
            margin-top: 22px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button[type="submit"]:hover {
            background: #d96f16;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: var(--stagecoach-blue);
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-top: 18px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .form {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="brand">
            <div class="brand-name">Stagecoach</div>
            <div class="brand-line"></div>
        </div>

        <form class="form" action="#" method="get">

            <h1>Welcome</h1>

            <p class="subtitle">
                Sign in to your Stagecoach account
            </p>

            <label for="email">Email address</label>

            <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter your email address"
                required
            >

            <button type="submit">
                Continue
            </button>

            <div class="links">
                <a href="#">Create an account</a>
                &nbsp; | &nbsp;
                <a href="#">Help</a>
            </div>

        </form>

        <div class="footer">
            © Stagecoach — Demo interface
        </div>

    </div>

</body>
</html>
